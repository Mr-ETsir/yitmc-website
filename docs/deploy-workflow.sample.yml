# ============================================================
# 自动部署模板：启用方法见 docs/CMS使用指南.md 第二节第 3 步
# 1. 把本文件移动/复制为 .github/workflows/deploy.yml
# 2. 仓库 Settings → Secrets → Actions 中配置 FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
#    （如服务器非 21 端口，再配 FTP_PORT；SFTP 场景可换成对应 Action）
# 启用后每次向 main 分支提交（含 CMS 后台保存）都会自动构建并上传到服务器。
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npx vite build

      - name: 上传到社团服务器（FTP）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: dist/
          server-dir: /          # ← 改成服务器上网站根目录，例如 /www/wwwroot/yitmc.cn/
